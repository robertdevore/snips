<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<!-- TODO: Migrate inline event handlers to external scripts to remove 'unsafe-inline' -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"
		/>
		<title>Snips Fill</title>
		<link rel="stylesheet" href="fill.css" />
	</head>
	<body>
		<div class="shell">
			<div class="header">
				<div class="title">Fill in fields</div>
			</div>
			<div id="fields" class="fields"></div>
			<div class="actions">
				<button id="cancelBtn" class="secondary">Cancel</button>
				<button id="okBtn">Insert</button>
			</div>
		</div>
		<script src="fill.js"></script>
	</body>
</html>
